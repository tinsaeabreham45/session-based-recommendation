<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}Session-Based Recommendation System{% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link
      href="{{ url_for('static', filename='css/main.css') }}"
      rel="stylesheet"
    />

    <!-- Additional CSS for specific pages -->
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="/" style="color: white !important">
          <span class="fw-bold">Graph Recommender</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('start_session') }}"
                >Interactive Demo</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('patterns') }}">Patterns</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('graph_visualization') }}"
                >Graph Visualization</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('prompt_page') }}"
                >LLM Prompt</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">{% block content %}{% endblock %}</main>

    <!-- Footer -->
    <footer class="container py-4 footer">
      <div class="text-center">
        <p class="mb-0">
          Built with Neo4j, Flask, and Bootstrap. Session-Based Recommendation
          System.
        </p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Socket.IO for real-time features -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- Page-specific JS -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
